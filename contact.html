<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Marcellus&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Contact — Ha Nguyen Portfolio</title>
<link rel="icon" type="image/png" href="honeybear.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<nav>
  <div class="nav-left">
    <a class="nav-logo" href="index.html" aria-label="Go to home">
      <img src="honeybear-logo.png" alt="logo">
    </a>
    <ul class="nav-links">
      <li><a href="about.html" id="nav-about">About</a></li>
      <li><a href="projects.html" id="nav-projects">Projects</a></li>
      <li><a href="artwork.html" id="nav-artwork">Artwork</a></li>
      <li><a href="travel.html" id="nav-travel">Travel</a></li>
      <li><a href="contact.html" id="nav-contact" class="active">Contact</a></li>
    </ul>
  </div>
  <div class="season-picker">
    <span>choose your season</span>
    <button id="season-cycle" type="button" aria-label="Choose your season. Current season: Summer Dreams. Click to change season.">
      <span id="season-name">Summer Dreams</span>
    </button>
  </div>
</nav>
<section id="contact" class="page active">
  <div class="page-wrapper">
    <div class="page-header fade-in">
      <h1 class="page-title">Contact <span>Me</span></h1>
      <div class="title-underline"><div class="bar"></div><div class="diamond"></div><div class="bar"></div></div>
    </div>
    <div class="contact-layout">
      <div class="contact-info fade-in fade-in-d1">
        <h3>✦ Let's Connect</h3>
        <p>Send me a message or just say hi!</p>
        <div class="contact-visual">
          <img src="cafetrada.png" alt="Cafe Tra Da illustration">
        </div>
        <div class="contact-socials" aria-label="Contact links">
          <a class="contact-social" href="mailto:hannia.hanguyen@gmail.com" aria-label="Email">
            <span>Email</span>
          </a>
          <a class="contact-social" href="https://www.linkedin.com/in/hannia-nguyen/" target="_blank" rel="noopener" aria-label="LinkedIn">
            <span>LinkedIn</span>
          </a>
          <a class="contact-social" href="https://github.com/hannianguyen" target="_blank" rel="noopener" aria-label="GitHub">
            <span>GitHub</span>
          </a>
        </div>
      </div>
      <div class="fade-in fade-in-d2">
        <form class="contact-form" action="https://formsubmit.co/ajax/hannia.hanguyen@gmail.com" method="POST">
          <input type="hidden" name="_subject" value="New message from your portfolio contact form">
          <div><label class="form-label" for="name">Your Name</label><input type="text" id="name" name="name" class="form-input" placeholder="Enter here…" autocomplete="name" required></div>
          <div><label class="form-label" for="cemail">Email Address</label><input type="email" id="cemail" name="email" class="form-input" placeholder="Enter here…" autocomplete="email" required></div>
          <div><label class="form-label" for="subject">Subject</label><input type="text" id="subject" name="subject" class="form-input" placeholder="Enter here…" required></div>
          <div><label class="form-label" for="message">Message</label><textarea id="message" name="message" class="form-textarea" placeholder="Enter here…" required></textarea></div>
          <button type="submit" class="form-submit">✦ Send Message ✦</button>
          <p id="form-msg" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
    <div class="section-divider section-divider-spaced"></div>
    <div class="viet-strip" aria-hidden="true"></div>
  </div>
  <footer>© 2026 Hannia Nguyen ❤︎⁠ All rights reserved.</footer>
</section>
<script src="site.js?v=20261115-contact-copy" defer></script>
</body>
</html>
